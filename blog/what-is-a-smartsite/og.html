<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: 'Inter Tight', 'Inter', -apple-system, sans-serif;
    background: radial-gradient(120% 140% at 82% 30%, #103524 0%, #0b1512 42%, #070709 75%);
    color:#fff; position:relative;
  }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .b1 { width:520px; height:520px; right:-80px; top:-120px; background:#2ec27e; opacity:.26; }
  .b2 { width:380px; height:380px; left:-120px; bottom:-160px; background:#1a6d47; opacity:.35; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }
  .left { width:660px; display:flex; flex-direction:column; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:26px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:96px; line-height:.96; font-weight:900; letter-spacing:-.025em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.75); }
  .sub { margin-top:24px; font-size:29px; font-weight:700; color:rgba(255,255,255,.82); white-space:nowrap; }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:0; top:0; width:560px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .coin { width:400px; height:400px; border-radius:50%;
    background: radial-gradient(circle at 34% 30%, #37e394, #17914f 58%, #0a5c30);
    box-shadow: 0 0 0 14px rgba(46,194,126,.18), 0 0 120px rgba(46,194,126,.55), inset 0 -22px 60px rgba(0,0,0,.45), inset 0 20px 40px rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; }
  .card { width:300px; height:330px; border-radius:26px; background:#0e1a14;
    border:2px solid rgba(46,194,126,.45); box-shadow:0 30px 80px rgba(0,0,0,.6);
    padding:22px; display:flex; flex-direction:column; gap:14px; }
  .av { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#37e394,#0a5c30); }
  .nm { font-size:25px; font-weight:800; }
  .hd { font-family:'JetBrains Mono'; font-size:17px; color:#5ff0ab; margin-top:-8px; }
  .tabs { display:flex; gap:8px; margin-top:2px; }
  .tab { font-family:'JetBrains Mono'; font-size:15px; padding:7px 12px; border-radius:9px;
    background:rgba(255,255,255,.07); color:rgba(255,255,255,.6); }
  .tab.on { background:#2ec27e; color:#07120c; font-weight:700; }
  .row { display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.06); border-radius:12px; padding:13px 15px; font-size:18px; font-weight:600; }
  .row b { color:#5ff0ab; font-family:'JetBrains Mono'; }
  .lock { display:flex; align-items:center; gap:9px; font-size:17px; color:rgba(255,255,255,.45); }
  .chip { position:absolute; background:#0d1f16; border:2px solid #2ec27e; color:#5ff0ab;
    font-family:'JetBrains Mono'; font-weight:700; font-size:24px; padding:11px 20px;
    border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5), 0 0 30px rgba(46,194,126,.3); white-space:nowrap; }
  .c1 { right:392px; top:96px; transform:rotate(-7deg); }
  .c2 { right:44px; bottom:104px; transform:rotate(5deg); }
  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Guides</div>
      <h1>LINKS POINT.<br><span class="hl">THIS ONE<br>PAYS.</span></h1>
      <div class="sub">What a <b>SmartSite</b> actually is</div>
    </div>
  </div>
  <div class="right">
    <div class="coin"><div class="card">
      <div class="av"></div>
      <div class="nm">Travis</div>
      <div class="hd">travis.swop.id</div>
      <div class="tabs"><div class="tab on">Shop</div><div class="tab">Feed</div><div class="tab">Tokens</div></div>
      <div class="row"><span>Strategy call</span><b>25 USDC</b></div>
      <div class="lock">🔒 Members only</div>
    </div></div>
    <div class="chip c1">One link</div>
    <div class="chip c2">Paid in USDC</div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
