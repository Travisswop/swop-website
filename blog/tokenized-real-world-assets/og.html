<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body { font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: radial-gradient(120% 140% at 80% 30%, #103524 0%, #0b1512 42%, #070709 75%);
    color:#fff; position:relative; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .b1 { width:520px; height:520px; right:-80px; top:-120px; background:#2ec27e; opacity:.26; }
  .b2 { width:380px; height:380px; left:-120px; bottom:-160px; background:#1a6d47; opacity:.35; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }
  .left { width:640px; display:flex; flex-direction:column; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:26px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:96px; line-height:.97; font-weight:900; letter-spacing:-.025em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.75); }
  .sub { margin-top:24px; font-size:28px; font-weight:700; color:rgba(255,255,255,.82); }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:0; top:0; width:560px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .coin { width:400px; height:400px; border-radius:50%;
    background: radial-gradient(circle at 34% 30%, #ffe98a, #d6a92c 58%, #8a6a12);
    box-shadow: 0 0 0 14px rgba(46,194,126,.18), 0 0 120px rgba(46,194,126,.4), inset 0 -22px 60px rgba(0,0,0,.45), inset 0 20px 40px rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-8deg); }
  .bar { width:250px; height:132px; border-radius:12px;
    background: linear-gradient(150deg,#ffe07a 0%,#f5c542 26%,#d9a41f 55%,#b8860b 100%);
    box-shadow: 0 26px 60px rgba(0,0,0,.55), inset 0 6px 14px rgba(255,255,255,.55), inset 0 -10px 18px rgba(0,0,0,.28);
    transform: rotate(-9deg); position:relative; display:flex; align-items:center; justify-content:center; }
  .bar:before { content:''; position:absolute; inset:14px 18px; border-radius:6px; border:2px solid rgba(120,80,10,.28); }
  .bar b { font-family:'JetBrains Mono'; font-size:30px; font-weight:800; color:#6b4a06; letter-spacing:.08em; }
  .coin span { font-size:220px; line-height:1; transform:rotate(8deg);
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
  .prop1 { position:absolute; font-size:110px; right:90px; top:56px; opacity:.9;
    filter:blur(1px) drop-shadow(0 10px 24px rgba(0,0,0,.5)); transform:rotate(-10deg); }
  .prop2 { position:absolute; font-size:96px; right:56px; bottom:60px; opacity:.85;
    filter:blur(1px) drop-shadow(0 10px 24px rgba(0,0,0,.5)); transform:rotate(8deg); }
  .tag { position:absolute; right:64px; top:398px; background:#0d2a1c; color:#5ff0ab;
    font-family:'JetBrains Mono'; font-weight:700; font-size:26px; padding:12px 22px; border-radius:14px;
    border:1.5px solid rgba(95,240,171,.6); transform:rotate(-6deg); box-shadow:0 12px 34px rgba(0,0,0,.4); }
  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Guides</div>
      <h1>THE TOKEN<br>ISN'T THE<br><span class="hl">GOLD.</span></h1>
      <div class="sub">What backs a <b>tokenized asset</b></div>
    </div>
  </div>
  <div class="right">
    <div class="prop1">📜</div>
    <div class="coin"><div class="bar"><b>1 oz Au</b></div></div>
    <div class="prop2">🏛️</div>
    <div class="tag">REDEMPTION RIGHT</div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
