<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body { font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: linear-gradient(185deg, #07131a 0%, #0a1b1a 38%, #071010 70%, #050507 100%);
    color:#fff; position:relative; }
  .sky { position:absolute; left:0; right:0; top:0; height:430px;
    background: radial-gradient(90% 120% at 72% 92%, rgba(46,194,126,.42) 0%, rgba(20,80,70,.22) 38%, transparent 70%); }
  .sun { position:absolute; right:150px; bottom:208px; width:330px; height:330px; border-radius:50%;
    background: radial-gradient(circle at 50% 55%, #9effd0 0%, #2ec27e 42%, rgba(46,194,126,.16) 72%, transparent 76%);
    opacity:.55; filter:blur(2px); }
  .grid { position:absolute; left:0; right:0; bottom:0; height:200px;
    background:
      repeating-linear-gradient(to right, rgba(95,240,171,.20) 0 2px, transparent 2px 86px),
      linear-gradient(to top, rgba(95,240,171,.13) 0%, transparent 100%);
    transform: perspective(300px) rotateX(62deg); transform-origin: bottom center; opacity:.75; }
  .city { position:absolute; right:0; bottom:176px; width:760px; height:330px; z-index:1;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 42%, rgba(0,0,0,.45) 68%, rgba(0,0,0,.08) 88%, transparent 100%); }
  .px { position:absolute; bottom:0; background:#2ec27e; opacity:.5; border-radius:2px;
        box-shadow:0 0 12px rgba(46,194,126,.6); z-index:2; }
  .b { position:absolute; bottom:0; background:linear-gradient(180deg, #123528 0%, #0a1b16 100%);
       border-top:2px solid rgba(95,240,171,.55); box-shadow:0 0 34px rgba(46,194,126,.16); }
  .b::after { content:''; position:absolute; inset:10px 8px auto 8px; height:62%;
       background-image: radial-gradient(circle, rgba(159,255,209,.85) 1.6px, transparent 1.9px);
       background-size: 15px 20px; opacity:.5; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.02) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:54px 70px; display:flex; z-index:3; }
  .left { width:700px; display:flex; flex-direction:column; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:25px; letter-spacing:.45em; margin-bottom:20px; }
  .kick { display:inline-flex; align-items:center; gap:11px; background:rgba(46,194,126,.16);
    border:1.5px solid rgba(46,194,126,.62); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:19px; font-weight:700; letter-spacing:.11em; padding:9px 18px; border-radius:999px;
    width:max-content; margin-bottom:24px; text-transform:uppercase; }
  .dot { width:11px; height:11px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:74px; white-space:nowrap; margin-top:54px; line-height:.94; font-weight:900; letter-spacing:-.032em;
       text-shadow:0 6px 36px rgba(0,0,0,.85), 0 2px 10px rgba(0,0,0,.7); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 44px rgba(46,194,126,.8), 0 4px 22px rgba(0,0,0,.8); }
  .sub { margin-top:28px; font-size:24px; font-weight:700; color:rgba(255,255,255,.85);
         text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .sub b { color:#5ff0ab; }
  .stamp { position:absolute; right:78px; top:96px; transform:rotate(-6deg); z-index:4;
    background:#e5484d; color:#fff; border-radius:12px; padding:14px 24px;
    font-family:'JetBrains Mono'; font-weight:800; font-size:30px; letter-spacing:.05em;
    box-shadow:0 20px 54px rgba(0,0,0,.7); text-transform:uppercase; }
  .url { position:absolute; left:70px; bottom:32px; font-family:'JetBrains Mono';
    font-size:19px; color:rgba(255,255,255,.55); letter-spacing:.06em; z-index:3; }
</style></head>
