<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body { font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: radial-gradient(120% 140% at 78% 32%, #123a26 0%, #0b1512 44%, #070709 76%);
    color:#fff; position:relative; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .b1 { width:560px; height:560px; right:-110px; top:-140px; background:#2ec27e; opacity:.28; }
  .b2 { width:420px; height:420px; left:-140px; bottom:-180px; background:#1a6d47; opacity:.34; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }
  .left { width:620px; display:flex; flex-direction:column; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:26px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:96px; line-height:.95; font-weight:900; letter-spacing:-.03em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.72); }
  .sub { margin-top:26px; font-size:25px; font-weight:700; color:rgba(255,255,255,.82); }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:52px; top:0; width:480px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .scene { position:relative; width:420px; height:420px; display:flex; align-items:center; justify-content:center; }
  .ring { position:absolute; width:400px; height:400px; border-radius:50%;
    border:2px solid rgba(95,240,171,.28); box-shadow:0 0 90px rgba(46,194,126,.3) inset; }
  .ring2 { position:absolute; width:316px; height:316px; border-radius:50%;
    border:2px dashed rgba(95,240,171,.22); }
  .visor { position:relative; width:290px; height:160px; border-radius:72px 72px 58px 58px;
    background: linear-gradient(160deg, #2b4034 0%, #16261e 62%, #0e1a14 100%);
    border:3px solid rgba(95,240,171,.5);
    box-shadow:0 26px 70px rgba(0,0,0,.65), 0 0 70px rgba(46,194,126,.3); }
  .lens { position:absolute; top:40px; width:92px; height:70px; border-radius:26px;
    background: radial-gradient(circle at 36% 32%, #c6ffe4 0%, #5ff0ab 38%, #2ec27e 72%, #0d5c3a 100%);
    box-shadow:0 0 30px rgba(46,194,126,.8); }
  .l1 { left:34px; } .l2 { right:34px; }
  .strap { position:absolute; top:62px; left:-28px; width:346px; height:34px; border-radius:18px;
    background:rgba(95,240,171,.16); z-index:-1; }
  .key { position:absolute; bottom:18px; right:2px; transform:rotate(-6deg);
    background:#5ff0ab; color:#06240f; font-family:'JetBrains Mono'; font-weight:700;
    font-size:19px; letter-spacing:.08em; padding:12px 20px; border-radius:10px;
    box-shadow:0 18px 44px rgba(0,0,0,.6); }
  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Beta &middot; ships weekly</div>
      <h1>WALK IN<br>WITH YOUR<br><span class="hl">OWN KEYS.</span></h1>
      <div class="sub">El Dorado &mdash; <b>a virtual world on Swop</b></div>
    </div>
  </div>
  <div class="right">
    <div class="scene">
      <div class="ring"></div>
      <div class="ring2"></div>
      <div class="visor">
        <div class="strap"></div>
        <div class="lens l1"></div>
        <div class="lens l2"></div>
      </div>
      <div class="key">your swop.id</div>
    </div>
  </div>
  <div class="url">swopme.co/eldorado</div>
</body></html>
