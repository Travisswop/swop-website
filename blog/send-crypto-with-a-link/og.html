<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body {
    font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: radial-gradient(120% 140% at 80% 30%, #103524 0%, #0b1512 42%, #070709 75%);
    color:#fff; position:relative;
  }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .b1 { width:520px; height:520px; right:-80px; top:-120px; background:#2ec27e; opacity:.26; }
  .b2 { width:380px; height:380px; left:-120px; bottom:-160px; background:#1a6d47; opacity:.35; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }
  .left { width:650px; display:flex; flex-direction:column; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:26px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:94px; line-height:.97; font-weight:900; letter-spacing:-.025em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.75); }
  .sub { margin-top:24px; font-size:29px; font-weight:700; color:rgba(255,255,255,.82); }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:0; top:0; width:550px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .disc { width:410px; height:410px; border-radius:50%;
    background: radial-gradient(circle at 34% 30%, rgba(55,227,148,.30), rgba(10,92,48,.20) 62%, transparent 72%);
    display:flex; align-items:center; justify-content:center; }
  .phone { width:264px; height:340px; border-radius:30px; background:#0e1a14;
    border:2px solid rgba(46,194,126,.5); box-shadow:0 30px 80px rgba(0,0,0,.6);
    padding:22px 20px; display:flex; flex-direction:column; gap:13px; }
  .lbl { font-family:'JetBrains Mono'; font-size:15px; color:#7d8b84; letter-spacing:.05em; }
  .amt { font-size:47px; font-weight:900; letter-spacing:-1px; line-height:1; }
  .amt span { color:#5ff0ab; }
  .linkbox { background:rgba(46,194,126,.12); border:1.5px dashed rgba(46,194,126,.65);
    border-radius:12px; padding:11px 13px; font-family:'JetBrains Mono'; font-size:15px; color:#5ff0ab; }
  .btn { margin-top:auto; background:#2ec27e; color:#07120c; border-radius:12px;
    text-align:center; padding:13px 0; font-weight:800; font-size:19px; }
  .chip { position:absolute; background:#0d1f16; border:2px solid #2ec27e; color:#5ff0ab;
    font-family:'JetBrains Mono'; font-weight:700; font-size:23px; padding:11px 19px;
    border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.5), 0 0 30px rgba(46,194,126,.3); white-space:nowrap; }
  .c1 { right:372px; top:92px; transform:rotate(-7deg); }
  .c2 { right:40px; bottom:96px; transform:rotate(5deg); }
  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Guides</div>
      <h1>NO ADDRESS.<br><span class="hl">JUST A LINK.</span></h1>
      <div class="sub">Send crypto to <b>a person</b>, not a string</div>
    </div>
  </div>
  <div class="right">
    <div class="disc">
      <div class="phone">
        <div class="lbl">SENDING</div>
        <div class="amt">50 <span>USDC</span></div>
        <div class="linkbox">swop.id/c/8f2a…</div>
        <div class="lbl">Anyone with this link can claim</div>
        <div class="btn">Share link</div>
      </div>
    </div>
    <div class="chip c1">Text it</div>
    <div class="chip c2">They claim it</div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
