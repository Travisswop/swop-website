<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body { font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: radial-gradient(120% 140% at 76% 24%, #10402a 0%, #0b1a14 44%, #070709 78%);
    color:#fff; position:relative; }
  .blob { position:absolute; border-radius:50%; filter:blur(92px); }
  .b1 { width:560px; height:560px; right:-120px; top:-150px; background:#2ec27e; opacity:.26; }
  .b2 { width:420px; height:420px; left:-140px; bottom:-180px; background:#1a6d47; opacity:.32; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.022) 90px 92px); }
  .scrim { position:absolute; inset:0; z-index:3;
    background: linear-gradient(100deg, rgba(7,7,9,.95) 0%, rgba(7,7,9,.86) 40%, rgba(7,7,9,.28) 58%, transparent 72%); }
  .wrap { position:absolute; inset:0; padding:54px 70px; z-index:5; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:25px; letter-spacing:.45em; }
  .kick { display:inline-flex; align-items:center; gap:11px; background:rgba(46,194,126,.15);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:19px; font-weight:700; letter-spacing:.11em; padding:9px 18px; border-radius:999px;
    margin-top:20px; text-transform:uppercase; }
  .dot { width:11px; height:11px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { margin-top:30px; font-size:72px; line-height:.95; font-weight:900; letter-spacing:-.032em;
       white-space:nowrap; text-shadow:0 6px 38px rgba(0,0,0,.8); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 48px rgba(46,194,126,.8); }
  .sub { margin-top:26px; font-size:25px; font-weight:700; color:rgba(255,255,255,.86);
         text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:60px; top:150px; height:470px; width:400px; z-index:2;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:62px; }
  .card { position:relative; width:360px; height:224px; border-radius:20px;
    background: linear-gradient(145deg, #278f5f 0%, #176a45 48%, #0e4028 100%);
    border:1px solid rgba(95,240,171,.42);
    box-shadow:0 30px 72px rgba(0,0,0,.65), 0 0 70px rgba(46,194,126,.22);
    transform:rotate(-7deg); }
  .card .chip { position:absolute; left:26px; top:26px; width:46px; height:34px; border-radius:7px;
    background:linear-gradient(145deg,#ffe9a8,#d9a93a); opacity:.9; }
  .card .amt { position:absolute; left:26px; bottom:56px; font-size:56px; font-weight:900;
    letter-spacing:-.03em; color:#fff; }
  .card .lbl { position:absolute; left:28px; bottom:30px; font-family:'JetBrains Mono';
    font-size:14px; letter-spacing:.14em; color:#9fe8c4; text-transform:uppercase; }
  .pin { position:absolute; right:-16px; bottom:-18px; width:96px; height:96px; border-radius:50% 50% 50% 4px;
    background:#2ec27e; transform:rotate(45deg);
    box-shadow:0 18px 44px rgba(0,0,0,.6), 0 0 50px rgba(46,194,126,.5); }
  .pin::after { content:''; position:absolute; left:32px; top:32px; width:32px; height:32px;
    border-radius:50%; background:#07130d; }
  .url { position:absolute; left:70px; bottom:32px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.55); letter-spacing:.06em; z-index:6; }
</style><!-- va:start --><script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script defer src="/_vercel/insights/script.js"></script><!-- va:end -->
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="right">
    <div class="card">
      <div class="chip"></div>
      <div class="amt">$25</div>
      <div class="lbl">at your counter</div>
      <div class="pin"></div>
    </div>
  </div>
  <div class="scrim"></div>
  <div class="wrap">
    <div class="logo">SWOP</div>
    <div class="kick"><div class="dot"></div>Geo Bucks &middot; Drops</div>
    <h1>STARBUCKS IS A BANK<br>THAT <span class="hl">SELLS COFFEE.</span></h1>
    <div class="sub">Your counter can run the same float &mdash; <b>by this afternoon</b></div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
