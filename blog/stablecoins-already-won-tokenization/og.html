<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); }
  body { font-family:'Inter Tight','Inter',-apple-system,sans-serif;
    background: radial-gradient(120% 140% at 80% 30%, #103524 0%, #0b1512 42%, #070709 75%);
    color:#fff; position:relative; }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); }
  .b1 { width:540px; height:540px; right:-100px; top:-130px; background:#2ec27e; opacity:.26; }
  .b2 { width:400px; height:400px; left:-130px; bottom:-170px; background:#1a6d47; opacity:.34; }
  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }
  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }
  .left { width:620px; display:flex; flex-direction:column; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:26px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }
  h1 { font-size:98px; line-height:.95; font-weight:900; letter-spacing:-.03em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .hl { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.72); }
  .sub { margin-top:26px; font-size:25px; font-weight:700; color:rgba(255,255,255,.82); }
  .sub b { color:#5ff0ab; }
  .right { position:absolute; right:40px; top:0; width:520px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .coinwrap { position:relative; width:420px; height:420px; display:flex; align-items:center; justify-content:center; }
  .coin { width:340px; height:340px; border-radius:50%;
    background: radial-gradient(circle at 34% 28%, #ffe9a8 0%, #e8bf5a 38%, #b98a24 72%, #7d5a12 100%);
    box-shadow:0 0 90px rgba(232,191,90,.42), 0 28px 70px rgba(0,0,0,.6), inset 0 0 0 10px rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; position:relative; }
  .dollar { font-family:'Inter Tight'; font-weight:900; font-size:170px; color:#4a3208;
    text-shadow:0 6px 0 rgba(255,255,255,.18); }
  .badge { position:absolute; left:-18px; bottom:4px; width:140px; height:140px; border-radius:50%;
    background:#1a6d47; border:6px solid #0b1512; box-shadow:0 0 50px rgba(46,194,126,.6), 0 18px 44px rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:center; }
  .check { font-family:'Inter Tight'; font-weight:900; font-size:86px; color:#5ff0ab;
    text-shadow:0 0 30px rgba(95,240,171,.8); line-height:1; }
  .tag { position:absolute; bottom:10px; right:-14px; transform:rotate(7deg);
    background:rgba(46,194,126,.16); border:1.5px solid rgba(95,240,171,.7); color:#eafff2;
    font-family:'JetBrains Mono'; font-weight:700; font-size:21px; letter-spacing:.06em;
    padding:13px 22px; border-radius:10px; box-shadow:0 18px 44px rgba(0,0,0,.5); text-transform:uppercase; }
  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Perspective</div>
      <h1>TOKENIZATION<br>ALREADY<br><span class="hl">WON.</span></h1>
      <div class="sub">Stablecoins are <b>$300B of proof</b></div>
    </div>
  </div>
  <div class="right">
    <div class="coinwrap">
      <div class="coin">
        <div class="dollar">$</div>
        <div class="badge"><div class="check">&#10003;</div></div>
      </div>
      <div class="tag">&gt;$300B live</div>
    </div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
