<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:'Inter Tight'; src:url('../../editorial/fonts/InterTight.ttf'); font-weight:800 900; }
  @font-face { font-family:'JetBrains Mono'; src:url('../../editorial/fonts/JetBrainsMono.ttf'); font-weight:600 700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: 'Inter Tight', 'Inter', -apple-system, sans-serif;
    background: radial-gradient(120% 140% at 82% 30%, #103524 0%, #0b1512 42%, #070709 75%);
    color:#fff; position:relative;
  }

  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.55; }
  .b1 { width:520px; height:520px; right:-80px; top:-120px; background:#2ec27e; opacity:.28; }
  .b2 { width:380px; height:380px; left:-120px; bottom:-160px; background:#1a6d47; opacity:.35; }

  .stripes { position:absolute; inset:0;
    background: repeating-linear-gradient(115deg, transparent 0 90px, rgba(255,255,255,.025) 90px 92px); }

  .wrap { position:absolute; inset:0; padding:56px 72px; display:flex; }

  .left { width:660px; display:flex; flex-direction:column; justify-content:flex-start; z-index:2; }
  .logo { font-family:'JetBrains Mono'; font-weight:800; font-size:26px; letter-spacing:.45em; margin-bottom:24px; }
  .kick { display:inline-flex; align-items:center; gap:12px; background:rgba(46,194,126,.14);
    border:1.5px solid rgba(46,194,126,.6); color:#5ff0ab; font-family:'JetBrains Mono';
    font-size:21px; font-weight:700; letter-spacing:.12em; padding:10px 20px; border-radius:999px;
    width:max-content; margin-bottom:20px; text-transform:uppercase; }
  .dot { width:12px; height:12px; border-radius:50%; background:#2ec27e; box-shadow:0 0 14px #2ec27e; }

  h1 { font-size:90px; line-height:1; font-weight:900; letter-spacing:-.02em;
       text-shadow:0 8px 40px rgba(0,0,0,.6); }
  h1 .g { color:#5ff0ab; text-shadow:0 0 46px rgba(46,194,126,.75); }
  .sub { margin-top:22px; font-size:26px; font-weight:700; color:rgba(255,255,255,.82); max-width:560px; white-space:nowrap; }
  .sub b { color:#5ff0ab; }

  .right { position:absolute; right:0; top:0; width:560px; height:630px; z-index:1;
    display:flex; align-items:center; justify-content:center; }
  .coin {
    width:400px; height:400px; border-radius:50%;
    background: radial-gradient(circle at 34% 30%, #37e394, #17914f 58%, #0a5c30);
    box-shadow: 0 0 0 14px rgba(46,194,126,.18), 0 0 120px rgba(46,194,126,.55), inset 0 -22px 60px rgba(0,0,0,.45), inset 0 20px 40px rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-8deg);
  }
  .coin span { font-size:220px; line-height:1; transform:rotate(8deg);
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
  .scale { position:absolute; right:56px; top:80px; font-size:96px; opacity:.8; filter:blur(1px)
    drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  .tag { position:absolute; right:64px; top:452px; background:#ff2e2e; color:#fff;
    font-weight:900; font-size:32px; padding:14px 26px; border-radius:16px; transform:rotate(-6deg);
    box-shadow:0 12px 40px rgba(255,46,46,.45); letter-spacing:.01em; font-family:'JetBrains Mono'; }

  .url { position:absolute; left:72px; bottom:34px; font-family:'JetBrains Mono';
    font-size:20px; color:rgba(255,255,255,.5); letter-spacing:.06em; }
</style></head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="stripes"></div>
  <div class="wrap">
    <div class="left">
      <div class="logo">SWOP</div>
      <div class="kick"><div class="dot"></div>Guides</div>
      <h1>YOUR KEYS.<br>NOT YOUR<br><span class="g">LAW.</span></h1>
      <div class="sub">What <b>Bangladesh's rules</b> actually say</div>
    </div>
  </div>
  <div class="right">
    <div class="coin"><span>🔑</span></div>
    <div class="scale">⚖️</div>
    <div class="tag">CHECK LOCAL LAW</div>
  </div>
  <div class="url">swopme.co/blog</div>
</body></html>
