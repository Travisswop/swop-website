<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Swop share card</title>
<!-- Share-card template for the product pages. Render one card per page: open og.html#<slug> at 1200x630 in headless Chrome. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Mono:wght@700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#010108}
body{--acc:#3FE08F;position:relative;color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 70% 80% at 30% 40%,#000 20%,transparent 80%)}
.aura{position:absolute;width:820px;height:820px;right:-160px;top:-200px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--acc) 38%,transparent),transparent);filter:blur(30px)}
.aura2{position:absolute;width:520px;height:520px;left:-180px;bottom:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(56,189,248,.18),transparent);filter:blur(30px)}
.copy{position:absolute;left:72px;top:64px;bottom:64px;width:600px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px}
.wm{width:104px;height:22px;color:#fff}
.prod{font:700 17px "Space Mono",monospace;letter-spacing:.06em;color:var(--acc);padding-left:14px;border-left:1px solid rgba(255,255,255,.25);line-height:22px}
.st{margin-left:6px;display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;border:1.5px solid currentColor;font:700 14px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.live{color:#3FE08F}.st.beta{color:#38bdf8}.st.building{color:#f5c842}
h1{margin-top:auto;font:900 88px/.9 Figtree,sans-serif;letter-spacing:-.055em}
h1 .hl{color:var(--acc)}
p{margin-top:24px;font:500 25px/1.32 Inter,sans-serif;color:rgba(255,255,255,.78);max-width:24ch}
.url{margin-top:28px;font:500 18px "JetBrains Mono",monospace;color:rgba(255,255,255,.5)}
.url b{color:#fff;font-weight:500}
.vis{position:absolute;right:48px;top:0;bottom:0;width:480px;display:flex;align-items:center;justify-content:center}
.device{width:300px;aspect-ratio:9/18.6;border-radius:48px;padding:10px;background:linear-gradient(150deg,#3a3a44,#121218 30%,#0b0b10 65%,#26262e);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 40px 80px rgba(0,0,0,.6),0 0 120px color-mix(in srgb,var(--acc) 22%,transparent);transform:rotate(-4deg) translateY(70px)}
.device img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:39px;display:block;background:#fafafa}
.win{width:470px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:#0b0b13;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 120px color-mix(in srgb,var(--acc) 22%,transparent);transform:rotate(-2deg)}
.win .tb{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08);font:500 13px "JetBrains Mono",monospace;color:rgba(255,255,255,.5)}
.win .tb i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.win .tb i:nth-child(2){background:#febc2e}.win .tb i:nth-child(3){background:#28c840}
.win .tb em{font-style:normal;margin-left:10px}
.win img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.code{padding:22px 24px;font:500 17px/1.7 "JetBrains Mono",monospace;color:rgba(255,255,255,.85);white-space:pre}
.code .k{color:#c084fc}.code .s{color:var(--acc)}.code .c{color:rgba(255,255,255,.4)}
.code .ok{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:10px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
</style></head>
<body>

<div class="grid"></div><div class="aura"></div><div class="aura2"></div>
<div class="copy">
  <div class="top"><svg class="wm" viewBox="0 0 88 18"><use href="#swop"/></svg><span class="prod" id="prod"></span><span class="st" id="st"></span></div>
  <h1 id="h1"></h1>
  <p id="p"></p>
  <div class="url">swopme.co/<b id="slug"></b></div>
</div>
<div class="vis" id="vis"></div>
<script>
const D={
 ovi:{acc:'#c084fc',prod:'ovi',st:'beta',h:'Tell Ovi.<br><span class="hl">It does it.</span>',p:'The AI inside Swop. Nothing moves until you say yes.',img:'../live/ovi-ask-swop-ex.jpg'},
 mcp:{acc:'#3FE08F',prod:'mcp',st:'live',h:'Swop, inside<br><span class="hl">any AI.</span>',p:'One URL adds Swop to ChatGPT, Claude or Grok, inside your caps.',img:'../live/mcp-ai-assistants-ex.jpg'},
 swopid:{acc:'#3FE08F',prod:'swop.id',st:'live',h:'One name.<br><span class="hl">Everything you are.</span>',p:'Your page, your wallet and your login, all at name.swop.id.',img:'../live/swopid-profile-ex.jpg'},
 pay:{acc:'#3FE08F',prod:'pay',st:'live',h:'One link.<br><span class="hl">Everyone pays.</span>',p:'People pay by card or crypto. AI agents pay on their own. You get USDC.',img:'../live/pay-products-ex.jpg'},
 geobucks:{acc:'#f5c842',prod:'geo bucks',st:'live',h:'Money that<br><span class="hl">lives local.</span>',p:'Launch your own store credit and drop rewards on the map.',img:'../live/geobucks-drops-map-ex.jpg'},
 trade:{acc:'#38bdf8',prod:'trading',st:'live',h:'Markets<br><span class="hl">are social.</span>',p:'Swaps, perps and prediction markets in one wallet. Copy any trader.',img:'../live/trade-predictions.jpg'},
 token:{acc:'#f5c842',prod:'swop token',st:'live',h:'One token.<br><span class="hl">Nine jobs.</span>',p:'SWOP pays for AI, rewards activity and runs El Dorado. No yield promised.',img:'../live/wallet-ex.jpg'},
 live:{acc:'#ff5d6c',prod:'live',st:'live',h:'Go live.<br><span class="hl">Sell live.</span>',p:'Stream from your phone or browser and let viewers buy mid-stream.',img:'../live/live-setup.jpg'},
 eldorado:{acc:'#f5c842',prod:'el dorado',st:'beta',h:'Walk into<br><span class="hl">the city.</span>',p:'The 3D world of Swop, where AI bots run real businesses.',win:'../live/eldorado-skyline.jpg',url:'swopme.co/eldorado'},
 decentrabet:{acc:'#38bdf8',prod:'decentrabet',st:'beta',h:'Set the odds.<br><span class="hl">Own the market.</span>',p:'Peer-to-peer prediction markets you deploy yourself. Testnet beta.',win:'../live/decentrabet-web.jpg',url:'decentrabet.vercel.app'},
 swivy:{acc:'#38bdf8',prod:'swivy',st:'building',h:'Wallets and login,<br><span class="hl">for every app.</span>',p:'Swop’s own wallet and identity platform for developers. Preview.',code:true}
};
const slug=(location.hash||'#pay').slice(1),d=D[slug];
document.body.style.setProperty('--acc',d.acc);
document.getElementById('prod').textContent=d.prod;
const st=document.getElementById('st');st.textContent=d.st;st.className='st '+d.st;
document.getElementById('h1').innerHTML=d.h;document.getElementById('p').textContent=d.p;document.getElementById('slug').textContent=slug;
const v=document.getElementById('vis');
if(d.img)v.innerHTML=`<div class="device"><img src="${d.img}" alt=""></div>`;
else if(d.win)v.innerHTML=`<div class="win"><div class="tb"><i></i><i></i><i></i><em>${d.url}</em></div><img src="${d.win}" alt=""></div>`;
else v.innerHTML=`<div class="win"><div class="tb"><i></i><i></i><i></i><em>app.tsx · illustrative</em></div><div class="code"><span class="c">// Sign in with Swop</span>
<span class="k">const</span> { login } = <span class="k">useSwivy</span>()
<span class="k">await</span> login(<span class="s">'passkey'</span>)
<span class="k">const</span> [evm, sol] = wallets
<span class="ok">✓ EVM + Solana wallets ready</span></div></div>`;
</script>
